<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio private | SABI</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f3;color:#152820;font:16px system-ui,sans-serif}main{max-width:720px;margin:auto;padding:30px 20px}a{color:#087b60}h1{font-size:36px;letter-spacing:-1px}p{line-height:1.6;color:#52665c}.card{background:#fff;border:1px solid #dce9df;border-radius:16px;padding:22px}label{display:block;font-weight:700;font-size:14px}textarea{display:block;width:100%;min-height:150px;margin:10px 0 15px;padding:13px;font:inherit;line-height:1.5;border:1px solid #cbded1;border-radius:10px;resize:vertical}button,.download{display:inline-block;border:0;border-radius:9px;background:#087b60;color:white;padding:14px 18px;font:inherit;font-weight:750;min-height:48px;text-decoration:none}button:disabled{opacity:.6}img{max-width:100%;border-radius:10px;margin:18px 0}#status{font-size:14px}small{line-height:1.5;color:#52665c}</style></head><body><main><a href="/">← Kthehu te faqja</a><h1>Studio private AI</h1><p>Krijo një pamje për logon, postimin apo posterin tënd. Përshkruaj idenë, stilin, ngjyrat dhe çdo tekst që dëshiron.</p><div class="card"><form id="form"><label for="prompt">Përshkrimi i dizajnit</label><textarea id="prompt" minlength="10" maxlength="2000" required placeholder="P.sh. Një poster minimalist për një kafene, me ngjyra bezhë dhe jeshile…"></textarea><button type="submit">Krijo dizajnin</button></form><p id="status" role="status"></p><div id="result"></div><small>Krijimi i imazheve përdor kreditet e tua VibeKit. Kontrollo rezultatin dhe tekstin para se t’ia dërgosh klientit.</small></div></main><script>document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const button=e.currentTarget.querySelector('button'),status=document.querySelector('#status'),result=document.querySelector('#result');button.disabled=true;status.textContent='Po krijohet dizajni. Kjo mund të zgjasë pak…';result.replaceChildren();try{const r=await fetch('/api/design',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:document.querySelector('#prompt').value})});const data=await r.json();if(!r.ok)throw Error(data.error);const img=document.createElement('img');img.src=data.image;img.alt='Dizajni i krijuar';const link=document.createElement('a');link.href=data.image;link.download='sabi-dizajn.png';link.textContent='Shkarko dizajnin';link.className='download';result.append(img,document.createElement('br'),link);status.textContent='Dizajni u krijua.'}catch(err){status.textContent=err.message||'Krijimi nuk u krye.'}finally{button.disabled=false}})</script></body></html>
