<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hyr në studion private</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f3;color:#152820;font:16px system-ui,sans-serif}main{max-width:480px;margin:10vh auto;padding:24px}form{background:white;border:1px solid #dce9df;border-radius:16px;padding:24px}p{line-height:1.6;color:#52665c}label{font-weight:700}input{display:block;width:100%;padding:14px;margin:10px 0 15px;font:inherit;border:1px solid #cbded1;border-radius:9px}button{background:#087b60;color:white;border:0;border-radius:9px;padding:14px;font:inherit;font-weight:700;width:100%;min-height:48px}a{color:#087b60}</style></head><body><main><a href="/">← Kthehu te faqja</a><h1>Studio private</h1><p>Shkruaj kodin shtesë për të hapur studion.</p><form id="form"><label for="code">Kodi i studios</label><input id="code" type="password" autocomplete="off" required maxlength="200"><button>Hap studion</button><p id="status" role="status"></p></form></main><script>document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const button=e.currentTarget.querySelector('button'),status=document.querySelector('#status');button.disabled=true;status.textContent='Duke kontrolluar…';try{const r=await fetch('/api/studio-unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.querySelector('#code').value})});const d=await r.json();if(!r.ok)throw Error(d.error);location.reload()}catch(err){status.textContent=err.message||'Nuk u krye. Provo përsëri.'}finally{button.disabled=false}})</script></body></html>
