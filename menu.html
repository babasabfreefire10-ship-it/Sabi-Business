<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu · SABI</title><style>body{margin:0;background:#080d0b;color:#f4fff7;font:16px system-ui}.wrap{max-width:650px;margin:auto;padding:22px}.muted{color:#91a69a}.item{background:#101a15;border:1px solid #20372a;border-radius:14px;padding:14px;margin:10px 0}.price{color:#00e676;font-weight:800}</style></head><body><main class="wrap"><h1 id="name">SABI MENU</h1><p class="muted" id="table"></p><div id="products">Po ngarkohet menuja...</div></main><script>const slug=new URLSearchParams(location.search).get("table");async function init(){if(!slug){document.getElementById("products").textContent="QR i pavlefshëm.";return}let r=await fetch("/api/public/menu/"+encodeURIComponent(slug));let d=await r.json();if(!r.ok){document.getElementById("products").textContent=d.error||"Menuja nuk u gjet.";return}document.getElementById("name").textContent=d.business.name;document.getElementById("table").textContent=d.table.name;document.getElementById("products").innerHTML=(d.products||[]).map(p=>`<article class="item"><b>${esc(p.name)}</b><p class="muted">${esc(p.description)}</p><div class="price">${(p.price_cents/100).toFixed(2)} ALL</div></article>`).join("")||"Menuja është bosh."}function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}init();</script></body></html>
