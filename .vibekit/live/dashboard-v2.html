<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SABI BUSINESS · V2</title>
<style>
:root{--g:#00e676;--bg:#080d0b;--p:#101a15;--l:#20372a;--m:#91a69a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#effff4;font:15px system-ui}.shell{max-width:1100px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-weight:900;letter-spacing:1px}.logo b{color:var(--g)}.tag{color:var(--m);font-size:12px}.btn,input{padding:12px;border-radius:10px;border:1px solid var(--l);background:#0a120d;color:white}.btn{background:var(--g);color:#041109;font-weight:800;border:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:16px}.num{font-size:28px;color:var(--g);font-weight:900}.muted{color:var(--m);font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.row input{flex:1;min-width:120px}.item{padding:12px 0;border-bottom:1px solid var(--l)}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="shell"><header class="head"><div><div class="logo">SABI <b>BUSINESS</b> <span class="tag">V2 PREMIUM</span></div><div class="muted">Business operations dashboard</div></div><button class="btn" onclick="load()">Rifresko</button></header>
<h1>Paneli i biznesit</h1><div id="stats" class="grid"></div>
<section class="card"><h2>Produktet e menusë</h2><div class="row"><input id="pname" placeholder="Emri i produktit"><input id="pprice" type="number" min="0" step=".01" placeholder="Çmimi (ALL)"><button class="btn" onclick="addProduct()">Shto produkt</button></div><div id="products" class="muted">Po ngarkohen...</div></section>
<section class="card" style="margin-top:14px"><h2>Tavolinat dhe QR</h2><div class="row"><input id="tname" placeholder="p.sh. Tavolina 1"><button class="btn" onclick="addTable()">Krijo QR për tavolinë</button></div><div id="tables"></div></section>
<section class="card" style="margin-top:14px"><h2>Porositë e fundit</h2><div id="orders" class="muted">Po ngarkohen...</div></section>
<p class="muted">V2 API module · Requires deployed V2 Worker and schema_v2.sql</p></div>
<script>
async function api(path,opts={}){let r=await fetch(path,{credentials:"same-origin",headers:{"content-type":"application/json"},...opts});let d=await r.json();if(!r.ok)throw Error(d.error||"Gabim");return d}
function money(c){return (Number(c||0)/100).toFixed(2)}
async function load(){try{let d=await api("/api/v2/overview");let s=d.stats||{};document.getElementById("stats").innerHTML=[["Produkte",s.products],["Porosi aktive",s.active_orders],["Rezervime në pritje",s.pending_reservations],["Xhiro e përfunduar",money(s.completed_revenue)+" ALL"]].map(x=>`<div class="card"><div class="num">${x[1]||0}</div><div class="muted">${x[0]}</div></div>`).join("");document.getElementById("orders").innerHTML=(d.orders||[]).map(o=>`<div class="item">${o.customer_name||"Klient"} · ${money(o.total_cents)} ALL · ${o.status}</div>`).join("")||"Nuk ka porosi.";let p=await api("/api/v2/products");document.getElementById("products").innerHTML=(p.products||[]).map(x=>`<div class="item">${x.name} · ${money(x.price_cents)} ALL <button class="btn" onclick="delProduct('${x.id}')">Fshi</button></div>`).join("")||"Shto produktin e parë.";let t=await api("/api/v2/tables");document.getElementById("tables").innerHTML=(t.tables||[]).map(x=>`<div class="item">${x.table_name} · <a style="color:#00e676" href="/menu.html?table=${x.qr_slug}">Hap menunë</a> · QR: ${x.qr_slug}</div>`).join("")||"Nuk ka tavolina."}catch(e){alert(e.message+" — Kontrollo që je i kyçur dhe ke publikuar V2 API.")}}
async function addProduct(){let name=document.getElementById("pname").value,price=Number(document.getElementById("pprice").value);if(!name||price<0)return alert("Plotëso emrin dhe çmimin.");await api("/api/v2/products",{method:"POST",body:JSON.stringify({name,priceCents:Math.round(price*100)})});document.getElementById("pname").value="";document.getElementById("pprice").value="";load()}
async function delProduct(id){if(confirm("Ta fshijmë produktin?")){await api("/api/v2/products/"+id,{method:"DELETE"});load()}}
async function addTable(){let name=document.getElementById("tname").value;if(!name)return;await api("/api/v2/tables",{method:"POST",body:JSON.stringify({name})});document.getElementById("tname").value="";load()}
load();
</script></body></html>
